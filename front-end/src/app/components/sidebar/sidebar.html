<aside class="sidebar">
  <div class="header">
    <div class="logo">Dependency<br />Heaven</div>
    <div class="user-profile">
      <div class="avatar">{{ usuario?.nome?.charAt(0) || 'U' }}</div>
      <div>
        <strong>{{ usuario?.nome || 'Usuário' }}</strong>
        <small>{{ usuario?.email }}</small>
      </div>
    </div>
  </div>

  <div class="menu-section">
    <div class="section-title">
      <h3>Meus templates</h3>
      <span>{{ templates.length }}</span>
    </div>

    <p *ngIf="carregando" class="empty-state">Carregando...</p>
    <p *ngIf="!carregando && templates.length === 0" class="empty-state">Nenhum template criado.</p>

    <ul class="template-list">
      <li *ngFor="let t of templates" [class.active]="t.ativo" (click)="selecionarTemplate(t)">
        <span>{{ t.nome }}</span>
        <button (click)="deleteTemplate(t, $event)" title="Excluir template">🗑️</button>
      </li>
    </ul>

    <button class="btn-create" (click)="criarTemplate()">+ Criar novo template</button>
  </div>

  <div class="footer-actions">
    <button class="btn-config">Configurações</button>
    <button class="btn-exit" (click)="sair()">Sair</button>
  </div>
</aside>
