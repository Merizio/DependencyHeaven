<main class="canvas-area">
  <div class="canvas-header">
    <div>
      <small>Template atual</small>
      <span class="template-title">{{ templateNome }}</span>
    </div>
    <button class="header-action" (click)="abrirModalNovaTarefa(null)">+ Nova tarefa</button>
  </div>

  <div class="dependency-board">
    <div *ngFor="let coluna of colunas; let i = index" class="dependency-column">
      <div class="column-title">Etapa {{ i + 1 }}</div>

      <div *ngFor="let tarefa of coluna" class="task-card" (click)="abrirModalNovaTarefa(tarefa)">
        <div class="task-header">
          <span class="task-name">#{{ tarefa.indiceLocal }} - {{ tarefa.titulo }}</span>
          <div class="task-icons">
            <span class="status-indicator"
                  [ngClass]="{
                    'green': tarefa.estado === 'FINALIZADO',
                    'yellow': tarefa.estado === 'EM_ANDAMENTO',
                    'red': tarefa.estado === 'BLOQUEADO'
                  }">
            </span>
            <button class="icon-btn danger" (click)="deleteTarefa(tarefa); $event.stopPropagation()" title="Excluir tarefa">🗑️</button>
          </div>
        </div>

        <div class="task-body">
          <span class="task-descript">{{ tarefa.descricao || 'Sem descrição.' }}</span>
        </div>

        <div class="task-dependencies" *ngIf="tarefa.dependenciasIds && tarefa.dependenciasIds.length > 0">
          <small>Depende de</small>
          <ul class="dep-list">
            <li *ngFor="let depId of tarefa.dependenciasIds" class="dep-item">
              <span>{{ getNomeTarefa(depId) }}</span>
              <button class="btn-remove-dep" (click)="removerDependencia(tarefa, depId); $event.stopPropagation()" title="Remover dependência">Remover</button>
            </li>
          </ul>
        </div>

        <div class="task-actions">
          <button *ngIf="tarefa.estado !== 'BLOQUEADO'" (click)="avancarEstado(tarefa); $event.stopPropagation()">
            {{ tarefa.estado === 'PENDENTE' ? 'Iniciar' : (tarefa.estado === 'EM_ANDAMENTO' ? 'Finalizar' : 'Reabrir') }}
          </button>
          <span *ngIf="tarefa.estado === 'BLOQUEADO'" class="blocked-msg">Bloqueada</span>
          <button class="secondary" (click)="adicionarDependencia(tarefa); $event.stopPropagation()">+ Dep</button>
        </div>
      </div>
    </div>
  </div>

  <button class="fab-add" (click)="abrirModalNovaTarefa(null)">+</button>

  @if (isTaskModalOpen) {
    <div class="overlay-fantasma" (click)="fecharModalTarefa()">
      <app-task
        [tarefa]="tarefa_click"
        (avisoFechar)="fecharModalTarefa()"
        (taskMod)="receberTarefaMod($event)"
        (avisoLista)="abrirTelaDependencias()"
        (click)="$event.stopPropagation()">
      </app-task>
    </div>
  }

  @if (isTelaDependencias) {
    <div class="overlay-fantasma" (click)="fecharListaDependencias()">
      <app-dependencies
        [tarefa]="tarefa_click"
        [lista]="tarefas"
        (avisoFecharLista)="fecharListaDependencias()"
        (taskAdd)="adicionarDependenciaModal($event)"
        (taskRem)="removerDependenciaModal($event)"
        (click)="$event.stopPropagation()">
      </app-dependencies>
    </div>
  }
</main>
